name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with Expo SDK
        run: npx expo install --fix

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Generate native Android project
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npx expo prebuild --platform android --no-install --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle.log

      - name: Report build error
        if: failure()
        run: |
          # Surface the Gradle / Metro error as annotations (readable without log access)
          python3 - <<'PY'
          import re
          log = open('gradle.log', errors='replace').read() if __import__('os').path.exists('gradle.log') else ''
          lines = log.splitlines()
          chunks = []
          for i, l in enumerate(lines):
              if 'What went wrong' in l or re.search(r'(^e: |error:|Error:|FAILED|SyntaxError|Unable to resolve)', l):
                  chunks.append('\n'.join(lines[max(0, i-2):i+25]))
          if not chunks:
              chunks = ['\n'.join(lines[-60:])]
          for c in chunks[:8]:
              print('::error title=Gradle::' + c[:4000].replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/AeroNav-${{ github.ref_name == 'main' && 'latest' || github.ref_name }}.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: AeroNav-apk
          path: dist/*.apk

      - name: Publish "latest" pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AeroNav (latest build)
          prerelease: true
          files: dist/*.apk
          body: |
            Automatic build of `main` (${{ github.sha }}).
            Training / simulation only — NOT for real navigation.

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
