name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with Expo SDK
        run: npx expo install --fix

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Generate native Android project
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npx expo prebuild --platform android --no-install --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/AeroNav-${{ github.ref_name == 'main' && 'latest' || github.ref_name }}.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: AeroNav-apk
          path: dist/*.apk

      - name: Publish "latest" pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AeroNav (latest build)
          prerelease: true
          files: dist/*.apk
          body: |
            Automatic build of `main` (${{ github.sha }}).
            Training / simulation only — NOT for real navigation.

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
